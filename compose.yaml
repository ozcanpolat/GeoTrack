# GeoTrack - YEREL GELİŞTİRME / DEMO ortamı
#   Yalnızca veritabanı:      docker compose up -d
#   Veritabanı + uygulama:    docker compose --profile app up -d --build   → http://localhost:8080
# Buradaki parola yalnızca geliştirme içindir; üretimde kullanmayın.
# Değerleri değiştirmek için .env.example dosyasını .env olarak kopyalayın.
services:
  db:
    image: postgis/postgis:17-3.5
    container_name: geotrack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geotrack}
      POSTGRES_USER: ${POSTGRES_USER:-geotrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geotrack_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - geotrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geotrack-web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__GeoTrack: "Host=db;Port=5432;Database=${POSTGRES_DB:-geotrack};Username=${POSTGRES_USER:-geotrack};Password=${POSTGRES_PASSWORD:-geotrack_dev_password}"
      Database__ApplyMigrationsOnStartup: "true"
      Database__SeedDemoData: "true"
      # İsteğe bağlı AI (ikisi de doluysa etkinleşir). Değerleri .env dosyasından verin:
      Ai__ApiKey: "${AI_API_KEY:-}"
      Ai__Model: "${AI_MODEL:-}"

volumes:
  geotrack_pgdata:
